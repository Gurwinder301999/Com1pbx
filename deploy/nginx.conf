# nginx reverse proxy for the Com1 site.
# Copy to /etc/nginx/conf.d/com1pbx.conf and reload nginx.
#
# Assumes gunicorn is listening on 127.0.0.1:8000 (see gunicorn.conf.py).
# Replace com1pbx.com with your domain, and adjust certificate paths.

upstream com1_app {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 16;
}

# ---------------------------------------------------------------- redirect http
server {
    listen 80;
    listen [::]:80;
    server_name com1pbx.com www.com1pbx.com;

    # Let ACME challenges through if you use certbot webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://com1pbx.com$request_uri;
    }
}

# ------------------------------------------------------------------- https host
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.com1pbx.com;

    ssl_certificate     /etc/letsencrypt/live/com1pbx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/com1pbx.com/privkey.pem;

    return 301 https://com1pbx.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name com1pbx.com;

    ssl_certificate     /etc/letsencrypt/live/com1pbx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/com1pbx.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2m;

    access_log /var/log/nginx/com1.access.log;
    error_log  /var/log/nginx/com1.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/json application/xml image/svg+xml application/javascript;

    # Static files straight off disk — faster than proxying, and the app's
    # Cache-Control header is mirrored here.
    location /static/ {
        alias /opt/com1/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /health {
        proxy_pass http://com1_app;
        access_log off;
    }

    location / {
        proxy_pass http://com1_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Serve a friendly page for upstream hiccups.
        error_page 502 503 504 /static/50x.html;
    }
}
