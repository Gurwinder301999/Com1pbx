{% extends "base.html" %}

{% block title %}Page not found — {{ company.name }}{% endblock %}

{% block body %}
<section class="section">
  <div class="container not-found">
    <span class="eyebrow">404</span>
    <h1 class="display-sm">That page moved or never existed.</h1>
    <p class="lede narrow">Head back to the catalogue, or tell us what you were looking for.</p>
    <div class="hero-actions">
      <a class="btn btn-dark" href="{{ url_for('products') }}">Browse products</a>
      <a class="btn btn-ghost" href="{{ url_for('contact') }}">Contact us</a>
    </div>
  </div>
</section>
{% endblock %}
