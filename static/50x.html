<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Com1 — temporarily unavailable</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f6f6f4; --ink:#0d0d0d; --muted:#76766f; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      padding: 32px;
    }
    .wrap { max-width: 520px; }
    .eyebrow {
      font-size: .72rem; font-weight: 600; letter-spacing: .18em;
      text-transform: uppercase; color: var(--muted);
    }
    h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); letter-spacing: -.035em; line-height: 1.05; margin: 14px 0 16px; }
    p { color: #3a3a38; line-height: 1.65; margin: 0 0 26px; }
    a.btn {
      display: inline-block; padding: .8rem 1.4rem; border-radius: 999px;
      background: var(--ink); color: #fff; text-decoration: none; font-size: .9rem;
    }
    a.muted { color: var(--muted); font-size: .85rem; text-decoration: none; margin-left: 16px; }
    a.muted:hover { color: var(--ink); }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="eyebrow">503 — Service unavailable</span>
    <h1>The site is briefly restarting.</h1>
    <p>
      The application server did not answer this request. It is usually back within a
      few seconds. If you were submitting an enquiry, please send it again.
    </p>
    <a class="btn" href="/">Try again</a>
    <a class="muted" href="tel:+919884019019">Or call +91 98840 19019</a>
  </div>
</body>
</html>
